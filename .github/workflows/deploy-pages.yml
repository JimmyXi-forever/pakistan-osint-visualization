
name: Deploy live OSINT map

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore live OSINT cache
        uses: actions/cache@v4
        with:
          path: .osint-cache
          key: live-osint-cache-${{ github.run_id }}
          restore-keys: |
            live-osint-cache-

      - name: Generate live OSINT data
        run: npm run update:live
        env:
          OSINT_TIMESPAN: 7days
          OSINT_MAX_RECORDS: 75
          OSINT_REQUEST_TIMEOUT_MS: 45000
          OSINT_RETRY_COUNT: 2
          OSINT_RETRY_DELAY_MS: 10000
          OSINT_LIVE_CACHE_PATH: .osint-cache/live-incidents.json

      - name: Validate data
        run: npm run validate

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
